name: Release security gate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  swift:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
      - name: Install only hash-locked binary developer tools
        run: |
          python3 -m venv .build/semgrep-venv
          .build/semgrep-venv/bin/python -m pip install --quiet --only-binary=:all: --require-hashes -r scripts/semgrep-requirements.txt
      - name: Test local rules and scan every production Swift file with networking denied
        run: python3 scripts/swift_security.py --semgrep .build/semgrep-venv/bin/semgrep --attest
      - name: Retain sanitized parser inventory, rule regressions, and run-bound evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-security-swift
          path: |
            .build/gates/security-swift.json
            .build/gates/swift-semgrep.json
            .build/gates/swift-rule-tests.json
          if-no-files-found: error
          retention-days: 14

  python:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize pinned CodeQL with security-extended queries
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none
          tools: linked # CLI 2.27.2, fixed by the action commit, not latest/nightly
          queries: security-extended
          db-location: .build/codeql-db
          dependency-caching: false
          trap-caching: false
      - name: Analyze locally without uploading source databases or SARIF
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: .build/gates
          upload: never
          upload-database: false
          category: release-python
      - name: Fail on blocking findings, failed extraction, or missing scan provenance
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: >-
          python3 scripts/security.py verify
          --language python
          --codeql "$CODEQL"
          --database ".build/codeql-db/python"
          --sarif ".build/gates/python.sarif"
      - name: Retain only successful gate evidence in this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-security-python
          path: |
            .build/gates/security-python.json
            .build/gates/extracted-python.json
            .build/gates/python.sarif
          if-no-files-found: error
          retention-days: 14
